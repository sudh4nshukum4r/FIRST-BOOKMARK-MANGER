<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLTABLE</title>
</head>
<body>
    <H1><U>HTML TABLE</U></H1>
    The table tag is used to define tables in html.
    It is used to display tabular data. 
<HR>


    <H3>TYPE OF TABLE. </H3>
   <p> 1) TR tag= Table Row.</p>

   <p> 2) TD tag= Table Data </p>

   <p> 3)TH= Table Headers</p>


<h5>Examples:</h5>



<table>
    <tr>
        <th>
            NAME
        </th>

        <th>
            SUBJECT
        </th>

        <TH>
            MARKS
        </TH>
    </tr>




    <TR>
        <TD>
            SUDHANSHU
        </TD>

        <TD>
            PYTHON
        </TD>
        
        <TD>
            100
        </TD>
    </TR>
</table>

</body>
</html>
