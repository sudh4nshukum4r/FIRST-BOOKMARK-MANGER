<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML LISTS</title>
</head>
<body>
    <H1>LISTS,TABLE & FORMS</H1>
    
    <H2><U>LISTS</H2></U>


    <!-- UNDERLINE LIST(UL) -->

    <h4>UNDERLINE LIST(UL)</H4>

    <ul>
        <li>Home</li>
        <li>About</li>
    </ul>
    <HR>

       <H4>ORDERED LIST(OL)</H4>

    <!-- ORDERED LIST(OL) -->
     <OL>
        <LI>PHONE</LI>
        <LI>PC</LI>
        <LI>LEPTOP</LI>
        <LI>TABLET</LI>
     </OL>
     <HR>


        <!-- DEFINITION LIST(DL) -->
         <H4>DEFINITION LIST(DL)</H4>
         <DL>
            <DT>DEFINITION OF TITLE:-</DT>
            <DD>THIS IS THE DEFINITION LIST.</DD>
         </DL>


    </table>


</body>
</html>
