<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS-LETS LEARN IT </title>
</head>

<body>
    <h1>Forms to apply for cources</h1>
    <form action="post">
        <div>
            <label for="username">Enter Your Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" </div>


            <div>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">MALE</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">FEMALE</label>
            </div>

            <div>
                <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                <label for="subscribe">SUBSCRIBE TO NEWSLATTER</label>
            </div>
            <br>

            <div>
                <label for="comment">ENTER YOUR COMMENT</label>
                <br>
                <textarea name="comment" rows="8" cols="40">ENTER YOUR COMMENT HERE....</textarea>
            </div>

            <div>
                <select name="cources">
                    <option value="python">PYTHON</option>
                    <option value="c++">C++</option>
                    <option value="java script">JAVA SCRIPT</option>
                    <option value="html">HTML</option>

                </select>
            </div>
    </form>

</body>

</html>
